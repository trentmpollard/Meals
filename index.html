<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meals">
<meta name="theme-color" content="#059669">
<title>Meals</title>
<style>
:root{
  --green:#059669;--green-lt:#d1fae5;--green-dk:#047857;
  --amber:#d97706;--amber-lt:#fef3c7;
  --red:#dc2626;--red-lt:#fee2e2;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g600:#4b5563;--g800:#1f2937;--g900:#111827;
  --white:#ffffff;--r:12px;--r-sm:8px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
[data-theme="dark"]{
  --g50:#0f172a;--g100:#1e293b;--g200:#334155;--g300:#475569;
  --g400:#64748b;--g600:#94a3b8;--g800:#cbd5e1;--g900:#f1f5f9;
  --white:#1e293b;
  --green-lt:rgba(5,150,105,0.18);--green-dk:#34d399;
  --amber-lt:rgba(217,119,6,0.18);--red-lt:rgba(220,38,38,0.2);
  --sh:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
}
[data-theme="dark"] .cat-fridge{background:rgba(219,234,254,0.12);color:#93c5fd}
[data-theme="dark"] .cat-freezer{background:rgba(237,233,254,0.12);color:#c4b5fd}
[data-theme="dark"] .cat-pantry-tag{background:rgba(254,249,195,0.12);color:#fde047}
[data-theme="dark"] .cook-banner{color:var(--green-dk)}
[data-theme="dark"] .meal-card-row:active{background:var(--g100)}
[data-theme="dark"] .ing-res-item{background:var(--g100)}
[data-theme="dark"] .ing-res-item:active{background:var(--g200)}
[data-theme="dark"] .sel-ing{background:var(--g100)}
[data-theme="dark"] .finput{background:var(--g100);border-color:var(--g200);color:var(--g900)}
[data-theme="dark"] .search-inp{background:var(--g100);border-color:var(--g200);color:var(--g900)}
[data-theme="dark"] .cat-opt{background:var(--g100);border-color:var(--g200);color:var(--g600)}
[data-theme="dark"] .cat-opt.sel.fridge{background:rgba(219,234,254,0.15);border-color:#3b82f6;color:#93c5fd}
[data-theme="dark"] .cat-opt.sel.freezer{background:rgba(237,233,254,0.15);border-color:#8b5cf6;color:#c4b5fd}
[data-theme="dark"] .cat-opt.sel.pantry{background:rgba(254,249,195,0.15);border-color:#eab308;color:#fde047}
[data-theme="dark"] .fchip{background:var(--g100);border-color:var(--g200)}
[data-theme="dark"] .btn-secondary{background:var(--g200);color:var(--g800)}
[data-theme="dark"] .eater-avatar{background:rgba(5,150,105,0.25)}
[data-theme="dark"] .theme-btn{background:var(--g100);color:var(--g600);border-color:var(--g200)}
[data-theme="dark"] .theme-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g50);color:var(--g900);overflow:hidden;transition:background .2s,color .2s}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* Header */
header{background:var(--white);border-bottom:1px solid var(--g200);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:var(--sh);z-index:10;flex-shrink:0}
.logo{width:34px;height:34px;flex-shrink:0}
.app-title{font-size:20px;font-weight:800;color:var(--g900);letter-spacing:-0.5px}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.stat-pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--green-lt);color:var(--green-dk)}
.hdr-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--g100);color:var(--g600);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.hdr-btn:active{background:var(--g200)}

/* Main */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:72px}
.section{display:none}.section.active{display:block}

/* Nav */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--g200);padding:6px 0;padding-bottom:max(6px,env(safe-area-inset-bottom));display:flex;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;background:none;border:none;cursor:pointer;color:var(--g400);font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.tab svg{width:20px;height:20px}
.tab.active{color:var(--green)}
.tab:active{opacity:.7}

/* Cards */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);margin:8px 14px;overflow:hidden}

/* Filter bar */
.filter-bar{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.fchip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--g200);background:var(--white);font-size:13px;font-weight:500;color:var(--g600);cursor:pointer;white-space:nowrap;flex-shrink:0}
.fchip.active{background:var(--green);color:var(--white);border-color:var(--green)}

/* Section label */
.slabel{padding:14px 14px 4px;font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.6px}

/* Buttons */
.btn{padding:9px 16px;border-radius:var(--r-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{opacity:.8}
.btn-primary{background:var(--green);color:var(--white)}
.btn-secondary{background:var(--g100);color:var(--g600)}
.btn-danger{background:var(--red-lt);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:13px}

/* Category tags */
.cat-tag{font-size:10px;padding:2px 6px;border-radius:5px;font-weight:600;flex-shrink:0}
.cat-fridge{background:#dbeafe;color:#1d4ed8}
.cat-freezer{background:#ede9fe;color:#6d28d9}
.cat-pantry-tag{background:#fef9c3;color:#854d0e}

/* Cook screen */
.cook-banner{margin:10px 14px;padding:11px 13px;background:var(--green-lt);border-radius:var(--r);border-left:3px solid var(--green);font-size:13px;color:var(--green-dk);line-height:1.4}
.meal-card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);margin:8px 14px;overflow:hidden}
.meal-card-row{padding:13px 14px;display:flex;align-items:center;gap:11px;cursor:pointer}
.meal-card-row:active{background:var(--g50)}
.r-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.r-dot.ready{background:var(--green)}
.r-dot.almost{background:var(--amber)}
.r-dot.not-ready{background:var(--g300)}
.meal-name{flex:1;font-size:16px;font-weight:600;color:var(--g900)}
.r-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.r-badge.ready{background:var(--green-lt);color:var(--green-dk)}
.r-badge.almost{background:var(--amber-lt);color:var(--amber)}
.r-badge.not-ready{background:var(--g100);color:var(--g600)}
.avg-star{font-size:12px;color:var(--g400);display:flex;align-items:center;gap:2px;margin-right:4px}
.avg-star span{color:#f59e0b}

/* Meal detail */
.meal-detail{border-top:1px solid var(--g100);padding:12px 14px;background:var(--g50)}
.meal-detail-btns{display:flex;gap:7px;margin-bottom:10px}
.ing-list{display:flex;flex-direction:column;gap:5px}
.ing-row{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--white);border-radius:var(--r-sm);border:1px solid var(--g100)}
.ing-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.in-s .ing-dot{background:var(--green)}
.out-s .ing-dot{background:var(--red)}
.ing-row-name{flex:1;font-size:14px;color:var(--g800)}
.out-s .ing-row-name{color:var(--g400);text-decoration:line-through}
.ratings-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.r-chip{display:flex;align-items:center;gap:4px;padding:3px 9px;background:var(--g100);border-radius:20px;font-size:12px}
.r-chip-name{font-weight:500;color:var(--g800)}
.r-chip-score{color:var(--green);font-weight:700}

/* Pantry */
.search-wrap{margin:10px 14px 0;position:relative}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--g400);font-size:13px;pointer-events:none}
.search-inp{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--g200);border-radius:10px;font-size:15px;background:var(--white);outline:none;font-family:inherit}
.search-inp:focus{border-color:var(--green)}
.pantry-item{display:flex;align-items:center;gap:11px;padding:14px;cursor:pointer;border-bottom:none}
.p-toggle{width:22px;height:22px;border-radius:50%;border:2px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.p-toggle.in{border-color:var(--green);background:var(--green-lt);color:var(--green)}
.p-toggle.out{border-color:var(--g300);background:var(--white);color:transparent}
.pantry-info{flex:1;min-width:0}
.pantry-name{font-size:15px;font-weight:500;color:var(--g900)}
.pantry-item.out-s .pantry-name{color:var(--g400)}
.meal-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.mtag{font-size:10px;padding:1px 6px;border-radius:5px;background:var(--green-lt);color:var(--green-dk);font-weight:500;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.del-btn{padding:5px 9px;border-radius:6px;background:var(--red-lt);color:var(--red);border:none;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}

/* Shop */
.shop-item{display:flex;align-items:center;gap:11px;padding:14px;cursor:pointer;border-bottom:none}
.shop-cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:transparent}
.shop-cb.chk{background:var(--green);border-color:var(--green);color:var(--white)}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:15px;font-weight:500;color:var(--g900)}
.shop-item.chk .shop-name{text-decoration:line-through;color:var(--g400)}
.shop-sub{font-size:11px;color:var(--g400);margin-top:1px}
.shop-clear-btn{font-size:12px;color:var(--green);background:none;border:none;font-weight:700;cursor:pointer}

/* Modals */
.mbdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end}
.mbdrop.open{display:flex}
.modal{background:var(--white);border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:max(16px,env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.mbdrop.open .modal{transform:translateY(0)}
.m-handle{width:36px;height:4px;background:var(--g200);border-radius:2px;margin:12px auto 0}
.m-hdr{display:flex;align-items:center;padding:14px 16px 10px;gap:10px}
.m-title{font-size:18px;font-weight:700;flex:1}
.m-close{width:28px;height:28px;border-radius:50%;background:var(--g100);border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g600)}
.m-body{padding:0 16px 16px}
.fg{margin-bottom:14px}
.flabel{font-size:13px;font-weight:600;color:var(--g600);margin-bottom:5px;display:block}
.finput{width:100%;padding:11px 13px;border:1.5px solid var(--g200);border-radius:var(--r-sm);font-size:16px;color:var(--g900);background:var(--white);outline:none;font-family:inherit;transition:border-color .15s}
.finput:focus{border-color:var(--green)}
.cat-sel{display:flex;gap:7px}
.cat-opt{flex:1;padding:9px 6px;border-radius:var(--r-sm);border:1.5px solid var(--g200);background:var(--white);font-size:13px;font-weight:500;cursor:pointer;text-align:center;color:var(--g600)}
.cat-opt.sel.fridge{background:#dbeafe;border-color:#3b82f6;color:#1d4ed8}
.cat-opt.sel.freezer{background:#ede9fe;border-color:#8b5cf6;color:#6d28d9}
.cat-opt.sel.pantry{background:#fef9c3;border-color:#eab308;color:#854d0e}
.sel-ings{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.sel-ing{display:flex;align-items:center;gap:7px;padding:8px 11px;background:var(--g50);border-radius:var(--r-sm);border:1px solid var(--g200)}
.sel-ing-name{flex:1;font-size:14px;font-weight:500}
.rm-ing{color:var(--g400);font-size:15px;background:none;border:none;cursor:pointer}
.ing-res{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ing-res-item{padding:9px 11px;border-radius:8px;background:var(--g50);cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px}
.ing-res-item:active{background:var(--g100)}
.ing-res-item.create{color:var(--green);font-weight:600}
.cook-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--g100);cursor:pointer}
.cook-item:last-child{border-bottom:none}
.cook-cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--g300);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:transparent}
.cook-cb.chk{background:var(--green);border-color:var(--green);color:var(--white)}
.cook-item-info{flex:1}
.cook-item-name{font-size:15px;font-weight:500}
.cook-item-sub{font-size:11px;color:var(--g400);margin-top:1px}
.cook-item-sub.already-out{color:var(--red)}
.er-block{padding:13px 0;border-bottom:1px solid var(--g100)}
.er-block:last-child{border-bottom:none}
.er-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.er-name{font-size:15px;font-weight:600}
.er-rel{font-size:11px;color:var(--g400)}
.er-score{font-size:26px;font-weight:800;color:var(--green)}
.r-slider{width:100%;accent-color:var(--green)}
.eater-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--g100)}
.eater-row:last-child{border-bottom:none}
.eater-avatar{width:36px;height:36px;border-radius:50%;background:var(--green-lt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--green-dk);flex-shrink:0}
.eater-info{flex:1}
.eater-name-txt{font-size:15px;font-weight:600}
.eater-rel-txt{font-size:12px;color:var(--g400)}

/* FAB */
.fab{position:fixed;bottom:78px;right:16px;width:50px;height:50px;border-radius:50%;background:var(--green);color:var(--white);border:none;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(5,150,105,.4);cursor:pointer;z-index:50}
.fab:active{transform:scale(.92)}

/* Toast */
.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--g900);color:var(--white);padding:9px 17px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:all .25s;z-index:200;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Theme toggle buttons */
.theme-sel{display:flex;gap:8px}
.theme-btn{flex:1;padding:10px 8px;border-radius:var(--r-sm);border:1.5px solid var(--g200);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;text-align:center;color:var(--g600)}
.theme-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
/* Settings section headings */
.set-section{font-size:12px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
/* Empty state */
.empty{padding:48px 24px;text-align:center;color:var(--g400)}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-title{font-size:16px;font-weight:600;color:var(--g600);margin-bottom:5px}
.empty-text{font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app">

<header>
  <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect width="48" height="48" rx="12" fill="#059669"/>
    <path d="M9 38 L9 10 L15 10 L24 26 L33 10 L39 10 L39 38 L33 38 L33 18 L25 32 L23 32 L15 18 L15 38 Z" fill="white"/>
  </svg>
  <span class="app-title">Meals</span>
  <div class="hdr-right">
    <span class="stat-pill" id="ready-pill">0 ready</span>
    <button class="hdr-btn" onclick="openFamilyModal()" title="Family">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>
    <button class="hdr-btn" onclick="openSettingsModal()" title="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="s-cook" class="section active">
    <div class="cook-banner">🍽️ Tap a meal to see ingredients — <strong>green = ready to cook tonight.</strong></div>
    <div id="cook-list"></div>
  </div>

  <div id="s-meals" class="section">
    <div id="meals-list"></div>
  </div>

  <div id="s-pantry" class="section">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-inp" id="pantry-search" placeholder="Search ingredients…" oninput="renderPantry()">
    </div>
    <div class="filter-bar" id="pantry-filters">
      <button class="fchip active" data-cat="all" onclick="setPantryFilter('all')">All</button>
      <button class="fchip" data-cat="fridge" onclick="setPantryFilter('fridge')">🧊 Fridge</button>
      <button class="fchip" data-cat="freezer" onclick="setPantryFilter('freezer')">❄️ Freezer</button>
      <button class="fchip" data-cat="pantry" onclick="setPantryFilter('pantry')">🥫 Pantry</button>
    </div>
    <div id="pantry-list"></div>
  </div>

  <div id="s-shop" class="section">
    <div id="shop-list"></div>
  </div>
</main>

<nav>
  <button class="tab active" data-s="cook" onclick="showSection('cook')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>Cook
  </button>
  <button class="tab" data-s="meals" onclick="showSection('meals')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Meals
  </button>
  <button class="tab" data-s="pantry" onclick="showSection('pantry')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>Pantry
  </button>
  <button class="tab" data-s="shop" onclick="showSection('shop')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 001.95-1.57l1.65-8.42H6"/></svg>Shop
  </button>
</nav>

<script>
// ── STATE ──────────────────────────────────────
const SK='meals_v1';
let S={
  meals:[],    // {id,name,ingredientIds:[],ratings:[{eaterId,score,date}]}
  pantry:[],   // {id,name,category:'fridge'|'freezer'|'pantry',inStock:bool}
  eaters:[],   // {id,name,relation}
  extras:[],   // {id,name,checked:bool}
  shopDone:[], // ingredientIds bought (checked off in shop = back in stock)
  expanded:null
};

let tIngSel=[];
let tCat=null;
let tPending='';
let tCookId=null;
let tCookChk={};
let tRateId=null;
let tRatings={};

// ── PERSIST ────────────────────────────────────
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function load(){try{const d=localStorage.getItem(SK);if(d)S={...S,...JSON.parse(d)}}catch(e){}}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}

// ── NAV ────────────────────────────────────────
let cur='cook';
function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const sec=document.getElementById('s-'+name);
  if(sec) sec.classList.add('active');
  const tab=document.querySelector('.tab[data-s="'+name+'"]');
  if(tab) tab.classList.add('active');
  cur=name;
  document.getElementById('fab').style.display=name==='cook'?'none':'flex';
  renderAll();
}

function handleFab(){
  if(cur==='meals') openMealModal();
  else if(cur==='pantry') openIngModal();
  else if(cur==='shop') openModal('shop-extra-modal');
}

// ── MODALS ─────────────────────────────────────
function openModal(id){
  const m=document.getElementById(id);
  m.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>m.classList.add('open')));
}
function closeModal(id){
  const m=document.getElementById(id);
  m.classList.remove('open');
  setTimeout(()=>{m.style.display='none'},300);
}
function backdropClose(e,id){if(e.target===document.getElementById(id))closeModal(id)}

// ── MEAL MODAL ─────────────────────────────────
function openMealModal(mealId=null){
  document.getElementById('meal-edit-id').value=mealId||'';
  if(mealId){
    const m=S.meals.find(x=>x.id===mealId);
    document.getElementById('meal-modal-title').textContent='Edit Meal';
    document.getElementById('meal-name-inp').value=m.name;
    tIngSel=[...m.ingredientIds];
  } else {
    document.getElementById('meal-modal-title').textContent='New Meal';
    document.getElementById('meal-name-inp').value='';
    tIngSel=[];
  }
  document.getElementById('ing-search-inp').value='';
  renderSelIngs();renderIngSearch();
  openModal('meal-modal');
}

function renderSelIngs(){
  document.getElementById('sel-ings').innerHTML=tIngSel.map(id=>{
    const ing=S.pantry.find(p=>p.id===id);
    if(!ing) return '';
    return `<div class="sel-ing"><span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span><span class="sel-ing-name">${ing.name}</span><button class="rm-ing" onclick="rmIngSel('${id}')">✕</button></div>`;
  }).join('');
}

function rmIngSel(id){tIngSel=tIngSel.filter(i=>i!==id);renderSelIngs();renderIngSearch()}

function renderIngSearch(){
  const q=document.getElementById('ing-search-inp').value.toLowerCase().trim();
  const avail=S.pantry.filter(p=>!tIngSel.includes(p.id));
  const filtered=q?avail.filter(p=>p.name.toLowerCase().includes(q)):avail;
  let html=filtered.slice(0,6).map(ing=>
    `<div class="ing-res-item" onclick="addIngToSel('${ing.id}')"><span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span>${ing.name}</div>`
  ).join('');
  const raw=document.getElementById('ing-search-inp').value.trim();
  if(raw&&!S.pantry.find(p=>p.name.toLowerCase()===raw.toLowerCase())){
    html+=`<div class="ing-res-item create" onclick="openNewIngFromMeal()">+ Create "${raw}"</div>`;
  }
  document.getElementById('ing-search-res').innerHTML=html;
}

function addIngToSel(id){
  if(!tIngSel.includes(id)) tIngSel.push(id);
  document.getElementById('ing-search-inp').value='';
  renderSelIngs();renderIngSearch();
}

function openNewIngFromMeal(){
  tPending=document.getElementById('ing-search-inp').value.trim();
  document.getElementById('new-ing-name').value=tPending;
  tCat=null;
  document.querySelectorAll('.cat-opt').forEach(b=>b.classList.remove('sel'));
  openModal('ing-modal');
}

function saveMeal(){
  const name=document.getElementById('meal-name-inp').value.trim();
  if(!name){showToast('Enter a meal name');return}
  if(tIngSel.length===0){showToast('Add at least one ingredient');return}
  const editId=document.getElementById('meal-edit-id').value;
  if(editId){
    const m=S.meals.find(x=>x.id===editId);
    m.name=name;m.ingredientIds=[...tIngSel];
  } else {
    S.meals.push({id:uid(),name,ingredientIds:[...tIngSel],ratings:[]});
  }
  save();closeModal('meal-modal');renderAll();
  showToast(editId?'Meal updated!':'Meal added!');
}

function deleteMeal(id){
  if(!confirm('Delete this meal?')) return;
  S.meals=S.meals.filter(m=>m.id!==id);
  if(S.expanded===id) S.expanded=null;
  save();renderAll();showToast('Meal deleted');
}

// ── INGREDIENT MODAL ───────────────────────────
function openIngModal(){
  tPending='';
  document.getElementById('new-ing-name').value='';
  tCat=null;
  document.querySelectorAll('.cat-opt').forEach(b=>b.classList.remove('sel'));
  openModal('ing-modal');
}

function selCat(cat){
  tCat=cat;
  document.querySelectorAll('.cat-opt').forEach(b=>b.classList.toggle('sel',b.dataset.cat===cat));
}

function saveIngredient(){
  const name=document.getElementById('new-ing-name').value.trim();
  if(!name){showToast('Enter an ingredient name');return}
  if(!tCat){showToast('Select where it is stored');return}
  const existing=S.pantry.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing){
    if(tPending){addIngToSel(existing.id);tPending='';closeModal('ing-modal');return}
    showToast('"'+name+'" is already in your pantry');return;
  }
  const ing={id:uid(),name,category:tCat,inStock:true};
  S.pantry.push(ing);save();
  if(tPending){
    addIngToSel(ing.id);tPending='';closeModal('ing-modal');
    document.getElementById('ing-search-inp').value='';
    renderSelIngs();renderIngSearch();
  } else {
    closeModal('ing-modal');renderAll();showToast(name+' added to pantry');
  }
}

function toggleStock(id){
  const ing=S.pantry.find(p=>p.id===id);
  if(!ing) return;
  ing.inStock=!ing.inStock;
  if(ing.inStock){S.shopDone=S.shopDone.filter(x=>x!==id)}
  save();renderAll();
}

function deleteIng(id){
  if(!confirm('Remove this ingredient from all meals too?')) return;
  S.pantry=S.pantry.filter(p=>p.id!==id);
  S.meals.forEach(m=>{m.ingredientIds=m.ingredientIds.filter(i=>i!==id)});
  S.shopDone=S.shopDone.filter(x=>x!==id);
  save();renderAll();
}

// ── COOK MODAL ────────────────────────────────
function openCookModal(mealId){
  const meal=S.meals.find(m=>m.id===mealId);
  if(!meal) return;
  tCookId=mealId;tCookChk={};
  meal.ingredientIds.forEach(id=>{
    const ing=S.pantry.find(p=>p.id===id);
    if(ing&&ing.inStock) tCookChk[id]=true;
  });
  document.getElementById('cook-modal-title').textContent='Cook It — '+meal.name;
  renderCookList();openModal('cook-modal');
}

function renderCookList(){
  const meal=S.meals.find(m=>m.id===tCookId);
  if(!meal) return;
  const html=meal.ingredientIds.map(id=>{
    const ing=S.pantry.find(p=>p.id===id);
    if(!ing) return '';
    if(!ing.inStock){
      return `<div class="cook-item" style="opacity:.5">
        <div class="cook-cb" style="border-color:var(--red)">!</div>
        <div class="cook-item-info"><div class="cook-item-name">${ing.name}</div><div class="cook-item-sub already-out">Already out of stock</div></div>
        <span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span>
      </div>`;
    }
    const chk=tCookChk[id]||false;
    return `<div class="cook-item" onclick="togCookChk('${id}')">
      <div class="cook-cb${chk?' chk':''}">${chk?'✓':''}</div>
      <div class="cook-item-info">
        <div class="cook-item-name">${ing.name}</div>
        <div class="cook-item-sub">${chk?'Will use up':'Still have some — uncheck'}</div>
      </div>
      <span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span>
    </div>`;
  }).join('');
  document.getElementById('cook-ing-list').innerHTML=html;
  const n=Object.values(tCookChk).filter(Boolean).length;
  document.getElementById('cook-done-btn').textContent=n>0?`Done — mark ${n} as used up`:'Done Cooking';
}

function togCookChk(id){tCookChk[id]=!tCookChk[id];renderCookList()}

function finishCooking(){
  const used=Object.entries(tCookChk).filter(([,v])=>v).map(([k])=>k);
  used.forEach(id=>{const ing=S.pantry.find(p=>p.id===id);if(ing)ing.inStock=false});
  S.shopDone=S.shopDone.filter(id=>!used.includes(id));
  save();closeModal('cook-modal');renderAll();
  showToast(used.length>0?used.length+' items added to shopping list':'Meal cooked!');
  if(S.eaters.length>0) setTimeout(()=>openRateModal(tCookId),400);
}

// ── RATE MODAL ────────────────────────────────
function openRateModal(mealId){
  const meal=S.meals.find(m=>m.id===mealId);
  if(!meal) return;
  tRateId=mealId;tRatings={};
  S.eaters.forEach(e=>{
    const ex=meal.ratings.find(r=>r.eaterId===e.id);
    tRatings[e.id]=ex?ex.score:7;
  });
  document.getElementById('rate-modal-title').textContent='Rate — '+meal.name;
  document.getElementById('rate-eaters').innerHTML=S.eaters.map(e=>`
    <div class="er-block">
      <div class="er-top">
        <div><div class="er-name">${e.name}</div><div class="er-rel">${e.relation}</div></div>
        <div class="er-score" id="rscore-${e.id}">${tRatings[e.id]}</div>
      </div>
      <input type="range" class="r-slider" min="0" max="10" value="${tRatings[e.id]}" oninput="updRating('${e.id}',this.value)">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--g400);margin-top:2px"><span>0 Nope</span><span>5 OK</span><span>10 Love it</span></div>
    </div>`).join('');
  openModal('rate-modal');
}

function updRating(eid,val){tRatings[eid]=parseInt(val);document.getElementById('rscore-'+eid).textContent=val}

function saveRatings(){
  const meal=S.meals.find(m=>m.id===tRateId);
  if(!meal) return;
  Object.entries(tRatings).forEach(([eid,score])=>{
    const idx=meal.ratings.findIndex(r=>r.eaterId===eid);
    if(idx>=0) meal.ratings[idx]={eaterId:eid,score,date:Date.now()};
    else meal.ratings.push({eaterId:eid,score,date:Date.now()});
  });
  save();closeModal('rate-modal');renderAll();showToast('Ratings saved!');
}

// ── FAMILY MODAL ──────────────────────────────
function openFamilyModal(){
  document.getElementById('eater-name-inp').value='';
  document.getElementById('eater-rel-inp').value='';
  renderFamilyModal();openModal('family-modal');
}

function renderFamilyModal(){
  const fl=document.getElementById('family-list');
  if(!S.eaters.length){
    fl.innerHTML='<div class="empty" style="padding:20px 0"><div class="empty-icon">👨‍👩‍👧</div><div class="empty-title">No family members yet</div></div>';
  } else {
    fl.innerHTML='<div class="card" style="margin:0 0 8px">'+S.eaters.map(e=>`
      <div class="eater-row">
        <div class="eater-avatar">${e.name[0].toUpperCase()}</div>
        <div class="eater-info"><div class="eater-name-txt">${e.name}</div><div class="eater-rel-txt">${e.relation}</div></div>
        <button class="del-btn" onclick="deleteEater('${e.id}')">Remove</button>
      </div>`).join('')+'</div>';
  }
  const fr=document.getElementById('family-ratings');
  const rated=S.meals.filter(m=>m.ratings.length>0);
  if(S.eaters.length&&rated.length){
    let html='<div style="font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.6px;padding:16px 0 8px">Ratings Summary</div>';
    S.eaters.forEach(e=>{
      const rs=S.meals.map(m=>({meal:m,r:m.ratings.find(x=>x.eaterId===e.id)})).filter(x=>x.r).sort((a,b)=>b.r.score-a.r.score);
      if(!rs.length) return;
      html+=`<div style="margin-bottom:14px"><div style="font-weight:600;font-size:14px;margin-bottom:6px">${e.name}</div>`;
      html+=rs.map(x=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span style="color:var(--g800)">${x.meal.name}</span><span style="font-weight:700;color:${x.r.score>=7?'var(--green)':x.r.score>=4?'var(--amber)':'var(--red)'}">${x.r.score}/10</span></div>`).join('');
      html+='</div>';
    });
    fr.innerHTML=html;
  } else {fr.innerHTML=''}
}

function saveEater(){
  const name=document.getElementById('eater-name-inp').value.trim();
  if(!name){showToast('Enter a name');return}
  const rel=document.getElementById('eater-rel-inp').value.trim()||'Family';
  S.eaters.push({id:uid(),name,relation:rel});
  document.getElementById('eater-name-inp').value='';
  document.getElementById('eater-rel-inp').value='';
  save();renderFamilyModal();renderAll();showToast(name+' added!');
}

function deleteEater(id){
  if(!confirm('Remove this family member?')) return;
  S.eaters=S.eaters.filter(e=>e.id!==id);
  S.meals.forEach(m=>{m.ratings=m.ratings.filter(r=>r.eaterId!==id)});
  save();renderFamilyModal();renderAll();
}

// ── SHOP ──────────────────────────────────────
function saveShopExtra(){
  const name=document.getElementById('shop-extra-inp').value.trim();
  if(!name){showToast('Enter an item');return}
  S.extras.push({id:uid(),name,checked:false});
  document.getElementById('shop-extra-inp').value='';
  save();closeModal('shop-extra-modal');renderShop();showToast('Added to list!');
}

function toggleShopIng(id){
  // Tap = bought it = back in stock
  const idx=S.shopDone.indexOf(id);
  const ing=S.pantry.find(p=>p.id===id);
  if(idx>=0){
    S.shopDone.splice(idx,1);
    if(ing) ing.inStock=false; // undo
  } else {
    S.shopDone.push(id);
    if(ing) ing.inStock=true;  // bought! restocked
  }
  save();renderAll();
}

function toggleShopExtra(id){
  const e=S.extras.find(x=>x.id===id);
  if(e){e.checked=!e.checked;save();renderShop()}
}

function clearShopDone(){
  S.extras=S.extras.filter(e=>!e.checked);
  S.shopDone=[];
  save();renderAll();showToast('Shopping list cleared!');
}

// ── DERIVED ───────────────────────────────────
function readiness(mealId){
  const m=S.meals.find(x=>x.id===mealId);
  if(!m) return{status:'not-ready',missing:[],total:0};
  const missing=m.ingredientIds.filter(id=>{const p=S.pantry.find(x=>x.id===id);return!p||!p.inStock});
  const status=missing.length===0?'ready':missing.length<=2?'almost':'not-ready';
  return{status,missing,total:m.ingredientIds.length};
}

function avgRating(mealId){
  const m=S.meals.find(x=>x.id===mealId);
  if(!m||!m.ratings.length) return null;
  return(m.ratings.reduce((a,r)=>a+r.score,0)/m.ratings.length).toFixed(1);
}

function ingMeals(ingId){return S.meals.filter(m=>m.ingredientIds.includes(ingId))}
function catIcon(c){return{fridge:'🧊',freezer:'❄️',pantry:'🥫'}[c]||c}
function catCls(c){return{fridge:'cat-fridge',freezer:'cat-freezer',pantry:'cat-pantry-tag'}[c]||''}
function rLabel(r){return r.status==='ready'?'Ready':`Missing ${r.missing.length}`}

// ── RENDER ────────────────────────────────────
function renderCook(){
  const el=document.getElementById('cook-list');
  if(!S.meals.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">🍽️</div><div class="empty-title">No meals yet</div><div class="empty-text">Go to the Meals tab and tap + to add your go-to recipes.</div></div>';
    document.getElementById('ready-pill').textContent='0 ready';return;
  }
  const sorted=[...S.meals].sort((a,b)=>{
    const o={ready:0,almost:1,'not-ready':2};
    return o[readiness(a.id).status]-o[readiness(b.id).status];
  });
  const readyN=sorted.filter(m=>readiness(m.id).status==='ready').length;
  document.getElementById('ready-pill').textContent=readyN+' ready';
  el.innerHTML=sorted.map(meal=>{
    const r=readiness(meal.id);const avg=avgRating(meal.id);const exp=S.expanded===meal.id;
    let detail='';
    if(exp){
      const ings=meal.ingredientIds.map(id=>{
        const ing=S.pantry.find(p=>p.id===id);if(!ing) return '';
        return `<div class="ing-row ${ing.inStock?'in-s':'out-s'}"><div class="ing-dot"></div><span class="ing-row-name">${ing.name}</span><span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span></div>`;
      }).join('');
      const ratHtml=meal.ratings.length?`<div class="ratings-wrap">${meal.ratings.map(rt=>{const e=S.eaters.find(x=>x.id===rt.eaterId);return e?`<div class="r-chip"><span class="r-chip-name">${e.name}</span><span class="r-chip-score">${rt.score}/10</span></div>`:''}).join('')}</div>`:'';
      detail=`<div class="meal-detail">
        <div class="meal-detail-btns">
          <button class="btn btn-primary" style="flex:1" onclick="event.stopPropagation();openCookModal('${meal.id}')">🍳 Cook It!</button>
          <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openMealModal('${meal.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteMeal('${meal.id}')">Delete</button>
        </div>
        <div class="ing-list">${ings}</div>${ratHtml}
      </div>`;
    }
    return `<div class="meal-card">
      <div class="meal-card-row" onclick="togExpand('${meal.id}')">
        <div class="r-dot ${r.status}"></div>
        <span class="meal-name">${meal.name}</span>
        ${avg?`<div class="avg-star"><span>★</span>${avg}</div>`:''}
        <span class="r-badge ${r.status}">${rLabel(r)}</span>
      </div>${detail}
    </div>`;
  }).join('');
}

function togExpand(id){S.expanded=S.expanded===id?null:id;renderCook()}

function renderMeals(){
  const el=document.getElementById('meals-list');
  if(!S.meals.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No meals added yet</div><div class="empty-text">Tap + to add your go-to meals and their ingredients.</div></div>';return;
  }
  el.innerHTML=S.meals.map(meal=>{
    const r=readiness(meal.id);const avg=avgRating(meal.id);
    return `<div class="card">
      <div style="padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="openMealModal('${meal.id}')">
        <div class="r-dot ${r.status}" style="width:10px;height:10px"></div>
        <div style="flex:1">
          <div style="font-size:16px;font-weight:600">${meal.name}</div>
          <div style="font-size:12px;color:var(--g400);margin-top:1px">${meal.ingredientIds.length} ingredients${avg?' · ★ '+avg:''}${meal.ratings.length?' · '+meal.ratings.length+' rating'+(meal.ratings.length!==1?'s':''):''}</div>
        </div>
        <span class="r-badge ${r.status}">${rLabel(r)}</span>
        <span style="color:var(--g400);font-size:18px">›</span>
      </div>
    </div>`;
  }).join('');
}

let pantryFilter='all';
function setPantryFilter(cat){
  pantryFilter=cat;
  document.querySelectorAll('#pantry-filters .fchip').forEach(c=>c.classList.toggle('active',c.dataset.cat===cat));
  renderPantry();
}

function renderPantry(){
  const el=document.getElementById('pantry-list');
  const q=(document.getElementById('pantry-search')||{value:''}).value.toLowerCase();
  let items=[...S.pantry];
  if(pantryFilter!=='all') items=items.filter(p=>p.category===pantryFilter);
  if(q) items=items.filter(p=>p.name.toLowerCase().includes(q));
  items.sort((a,b)=>a.inStock!==b.inStock?b.inStock-a.inStock:a.name.localeCompare(b.name));
  if(!items.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🥫</div><div class="empty-title">${S.pantry.length?'No matches':'Pantry is empty'}</div><div class="empty-text">${S.pantry.length?'Try a different search or filter.':'Add meals to populate your pantry automatically.'}</div></div>`;return;
  }
  const inStock=items.filter(p=>p.inStock);
  const outStock=items.filter(p=>!p.inStock);
  let html='';
  if(inStock.length){
    html+=`<div class="slabel">In stock (${inStock.length})</div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:6px;padding:0 14px 4px">`+inStock.map(pantryRow).join('')+`</div>`;
  }
  if(outStock.length){
    html+=`<div class="slabel">Out of stock (${outStock.length})</div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:6px;padding:0 14px 8px">`+outStock.map(pantryRow).join('')+`</div>`;
  }
  el.innerHTML=html;
}

function pantryRow(ing){
  const meals=ingMeals(ing.id);
  const tags=meals.slice(0,5).map(m=>`<span class="mtag">${m.name}</span>`).join('');
  const more=meals.length>5?`<span class="mtag" style="background:var(--g100);color:var(--g600)">+${meals.length-5}</span>`:'';
  return `<div class="card pantry-item${ing.inStock?'':' out-s'}" style="margin:0" onclick="toggleStock('${ing.id}')">
    <div class="p-toggle ${ing.inStock?'in':'out'}">${ing.inStock?'✓':''}</div>
    <div class="pantry-info"><div class="pantry-name">${ing.name}</div><div class="meal-tags">${tags}${more}</div></div>
    <span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span>
    <button class="del-btn" onclick="event.stopPropagation();deleteIng('${ing.id}')">✕</button>
  </div>`;
}

function renderShop(){
  const el=document.getElementById('shop-list');
  const outOfStock=S.pantry.filter(p=>!p.inStock);
  const pendingIngs=outOfStock.filter(p=>!S.shopDone.includes(p.id));
  const boughtIngs=S.pantry.filter(p=>S.shopDone.includes(p.id));
  const pendingExtras=S.extras.filter(e=>!e.checked);
  const doneExtras=S.extras.filter(e=>e.checked);
  const total=pendingIngs.length+pendingExtras.length;
  const doneTotal=boughtIngs.length+doneExtras.length;
  if(!total&&!doneTotal){
    el.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><div class="empty-title">Shopping list is empty</div><div class="empty-text">Cook a meal to auto-add used-up items, or tap + to add manually.</div></div>';return;
  }
  let html='';
  if(total){
    html+=`<div class="slabel">Need to buy (${total})</div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:6px;padding:0 14px 4px">`;
    html+=pendingIngs.map(ing=>{
      const ms=ingMeals(ing.id);
      const forTxt=ms.length?'For: '+ms.map(m=>m.name).join(', '):'';
      return `<div class="card shop-item" style="margin:0" onclick="toggleShopIng('${ing.id}')">
        <div class="shop-cb"></div>
        <div class="shop-info"><div class="shop-name">${ing.name}</div>${forTxt?`<div class="shop-sub">${forTxt}</div>`:''}</div>
        <span class="cat-tag ${catCls(ing.category)}">${catIcon(ing.category)}</span>
      </div>`;
    }).join('');
    html+=pendingExtras.map(e=>`<div class="card shop-item" style="margin:0" onclick="toggleShopExtra('${e.id}')">
      <div class="shop-cb"></div>
      <div class="shop-info"><div class="shop-name">${e.name}</div><div class="shop-sub">Manual add</div></div>
    </div>`).join('');
    html+=`</div>`;
  }
  if(doneTotal){
    html+=`<div class="slabel" style="display:flex;justify-content:space-between;align-items:center;padding-right:14px"><span>In cart — back in stock (${doneTotal})</span><button class="shop-clear-btn" onclick="clearShopDone()">Clear</button></div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:6px;padding:0 14px 8px">`;
    html+=boughtIngs.map(ing=>`<div class="card shop-item chk" style="margin:0" onclick="toggleShopIng('${ing.id}')">
      <div class="shop-cb chk">✓</div>
      <div class="shop-info"><div class="shop-name">${ing.name}</div><div class="shop-sub">Back in stock ✓</div></div>
    </div>`).join('');
    html+=doneExtras.map(e=>`<div class="card shop-item chk" style="margin:0" onclick="toggleShopExtra('${e.id}')">
      <div class="shop-cb chk">✓</div>
      <div class="shop-info"><div class="shop-name">${e.name}</div></div>
    </div>`).join('');
    html+=`</div>`;
  }
  el.innerHTML=html;
}

function renderAll(){renderCook();renderMeals();renderPantry();renderShop()}

// ── TOAST ─────────────────────────────────────
let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400);
}

// ── SETTINGS ──────────────────────────────────
function openSettingsModal(){
  const theme=localStorage.getItem('meals_theme')||'light';
  document.getElementById('theme-light').classList.toggle('active',theme==='light');
  document.getElementById('theme-dark').classList.toggle('active',theme==='dark');
  openModal('settings-modal');
}

function setTheme(theme){
  localStorage.setItem('meals_theme',theme);
  document.documentElement.setAttribute('data-theme',theme);
  document.getElementById('theme-light').classList.toggle('active',theme==='light');
  document.getElementById('theme-dark').classList.toggle('active',theme==='dark');
}

function loadTheme(){
  const theme=localStorage.getItem('meals_theme')||'light';
  document.documentElement.setAttribute('data-theme',theme);
}

function confirmClearData(){
  if(!confirm('This will permanently delete all your meals, pantry, and ratings. Are you sure?')) return;
  localStorage.removeItem(SK);
  S={meals:[],pantry:[],eaters:[],extras:[],shopDone:[],expanded:null};
  closeModal('settings-modal');renderAll();showToast('App data cleared');
}

// ── INIT ──────────────────────────────────────
loadTheme();load();renderAll();showSection('cook');

document.getElementById('meal-name-inp').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('ing-search-inp').focus()});
document.getElementById('ing-search-inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const r=document.querySelectorAll('#ing-search-res .ing-res-item:not(.create)');if(r.length===1)r[0].click()}
});
document.getElementById('shop-extra-inp').addEventListener('keydown',e=>{if(e.key==='Enter')saveShopExtra()});
</script>
